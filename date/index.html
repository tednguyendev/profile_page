<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ted nguyen date ted doc">
<title>date ted doc</title>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H0QLVMEDVT"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-H0QLVMEDVT', {
    page_title: 'date ted doc',
    page_path: '/date/'
  });
</script>
<link rel="icon" type="image/png" href="../ted.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f1;
    --panel: #ffffff;
    --panel-2: #f7f7f4;
    --border: #8b8f87;
    --text: #111513;
    --muted: #4d554f;
    --dim: #6b736d;
    --accent: #005f46;
    --gold: #6f4d00;
    --shadow: rgba(0, 0, 0, 0.18);
    --font: Arial, Helvetica, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.65;
  }

  ::-webkit-scrollbar { width: 12px; background: #eef1ed; border-left: 1px solid var(--border); }
  ::-webkit-scrollbar-thumb { background: #b9beb6; border: 1px solid var(--dim); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); border-color: var(--text); }

  .page {
    width: min(960px, calc(100% - 28px));
    margin: 18px auto;
    padding: 0;
    background: var(--panel);
    border: 2px solid var(--border);
    box-shadow: 8px 8px 0 var(--shadow);
    display: grid;
    grid-template-columns: 260px 1fr;
  }

  header {
    display: block;
    min-height: calc(100vh - 36px);
    padding: 24px;
    border-right: 2px solid var(--border);
    background: #eef1ed;
    position: sticky;
    top: 0;
    align-self: start;
  }

  h1 {
    margin: 0;
    color: var(--text);
    font-size: 36px;
    line-height: 1.05;
    text-transform: lowercase;
  }

  .nav {
    gap: 10px;
    display: grid;
    justify-content: stretch;
    margin-top: 18px;
  }

  button {
    appearance: none;
    background: #fff;
    border: 2px solid var(--text);
    color: var(--text);
    cursor: pointer;
    font: 700 13px var(--font);
    padding: 8px 11px;
    text-decoration: none;
  }

  button:hover,
  button:focus-visible {
    background: var(--text);
    color: #fff;
    outline: none;
  }

  .intro {
    margin: 0 0 18px;
    color: var(--muted);
  }

  #doc {
    min-width: 0;
    padding: 22px;
  }

  details {
    background: #fff;
    border: 2px solid var(--border);
    margin: 10px 0;
  }

  details[open] {
    border-color: #3e463f;
    background: #fcfcfa;
  }

  summary {
    cursor: pointer;
    color: var(--text);
    font-weight: 700;
    list-style: none;
    padding: 13px 15px;
    position: relative;
    background: #f0f2ee;
    border-bottom: 1px solid transparent;
  }

  summary::-webkit-details-marker { display: none; }

  summary::before {
    content: "○";
    color: var(--accent);
    display: inline-block;
    margin-right: 10px;
    width: 16px;
  }

  details[open] > summary {
    border-bottom-color: var(--border);
  }

  details[open] > summary::before { content: "●"; }

  summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .content {
    padding: 4px 20px 20px 42px;
  }

  .subsection {
    background: var(--panel-2);
    border: 1px solid var(--border);
    margin-top: 14px;
  }

  .subsection > summary {
    color: var(--text);
    font-size: 15px;
    padding: 10px 13px;
  }

  p { margin: 12px 0; color: var(--text); }
  ul { margin: 10px 0 14px; padding-left: 22px; }
  li { margin: 7px 0; }

  a {
    color: #004f9f;
    text-decoration: none;
    border-bottom: 2px solid #004f9f;
  }

  a:hover { border-bottom-style: solid; }

  img {
    display: block;
    max-width: min(100%, 720px);
    height: auto;
    margin: 14px 0;
  }

  blockquote {
    margin: 12px 0;
    padding: 2px 0 2px 16px;
    border-left: 3px solid var(--accent);
    color: var(--muted);
  }

  hr {
    border: 0;
    border-top: 2px dashed var(--border);
    margin: 18px 0;
  }

  @media (max-width: 640px) {
    .page {
      display: block;
      width: calc(100% - 18px);
      margin: 9px auto;
      box-shadow: 5px 5px 0 var(--shadow);
    }

    header {
      min-height: 0;
      position: static;
      border-right: 0;
      border-bottom: 2px solid var(--border);
      padding: 18px;
    }

    .nav {
      display: flex;
      justify-content: flex-start;
      margin-top: 14px;
    }

    #doc {
      padding: 16px;
    }

    .content {
      padding-left: 20px;
    }

  }
</style>
</head>
<body>
<main class="page">
  <header>
    <div>
      <h1>date ted doc</h1>
    </div>
    <nav class="nav" aria-label="Page controls">
      <button type="button" id="expand-all">expand all</button>
      <button type="button" id="fold-all">fold all</button>
      <button type="button" id="to-top">to top</button>
    </nav>
  </header>
  <article id="doc"></article>
</main>

<script>
const markdownPath = `content.md?v=${Date.now()}`;
const doc = document.getElementById('doc');
let currentSection = null;
let currentSectionContainer = null;
let currentContainer = null;
let pendingList = null;
let pendingQuote = null;

function track(eventName, params = {}) {
  if (typeof gtag !== 'function') return;
  gtag('event', eventName, {
    page_name: 'date',
    ...params
  });
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[char]));
}

function inlineMarkup(value) {
  return escapeHtml(value).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function flushBlocks() {
  pendingList = null;
  pendingQuote = null;
}

function activeContainer() {
  if (!currentContainer) {
    currentSection = makeDetails('notes', 'section');
    doc.appendChild(currentSection);
    currentSectionContainer = currentSection.querySelector('.content');
    currentContainer = currentSectionContainer;
  }
  return currentContainer;
}

function makeDetails(title, className) {
  const details = document.createElement('details');
  details.className = className;
  details.dataset.title = title;
  details.dataset.kind = className;
  const summary = document.createElement('summary');
  summary.textContent = title;
  const content = document.createElement('div');
  content.className = 'content';
  details.append(summary, content);
  return details;
}

function addParagraph(line) {
  flushBlocks();
  const image = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
  if (image) {
    const [, alt, src] = image;
    if (/\.(png|jpe?g|gif|webp|avif|svg)(\?.*)?$/i.test(src)) {
      const img = document.createElement('img');
      img.src = src;
      img.alt = alt || '';
      activeContainer().appendChild(img);
    } else {
      const p = document.createElement('p');
      p.innerHTML = `<a href="${escapeHtml(src)}" target="_blank" rel="noopener">${escapeHtml(alt || src)}</a>`;
      activeContainer().appendChild(p);
    }
    return;
  }

  const p = document.createElement('p');
  p.innerHTML = inlineMarkup(line);
  activeContainer().appendChild(p);
}

function render(source) {
doc.innerHTML = '';
currentSection = null;
currentSectionContainer = null;
currentContainer = null;
pendingList = null;
pendingQuote = null;

source.split('\n').forEach(rawLine => {
  const line = rawLine.trimEnd();

  if (!line.trim()) {
    flushBlocks();
    return;
  }

  if (line.startsWith('## ')) {
    flushBlocks();
    currentSection = makeDetails(line.slice(3).trim(), 'section');
    doc.appendChild(currentSection);
    currentSectionContainer = currentSection.querySelector('.content');
    currentContainer = currentSectionContainer;
    return;
  }

  if (line.startsWith('### ') || line.startsWith('= ')) {
    flushBlocks();
    const subsection = makeDetails(line.replace(/^(###|=)\s+/, '').trim(), 'subsection');
    activeContainer();
    currentSectionContainer.appendChild(subsection);
    currentContainer = subsection.querySelector('.content');
    return;
  }

  if (line === '[[section-note]]' || line === '<!-- section-note -->') {
    flushBlocks();
    currentContainer = currentSectionContainer;
    return;
  }

  if (line === '---') {
    flushBlocks();
    activeContainer().appendChild(document.createElement('hr'));
    return;
  }

  if (line.startsWith('- ')) {
    pendingQuote = null;
    if (!pendingList) {
      pendingList = document.createElement('ul');
      activeContainer().appendChild(pendingList);
    }
    const li = document.createElement('li');
    li.innerHTML = inlineMarkup(line.slice(2).trim());
    pendingList.appendChild(li);
    return;
  }

  if (line.startsWith('> ')) {
    pendingList = null;
    if (!pendingQuote) {
      pendingQuote = document.createElement('blockquote');
      activeContainer().appendChild(pendingQuote);
    }
    const p = document.createElement('p');
    p.innerHTML = inlineMarkup(line.slice(2).trim());
    pendingQuote.appendChild(p);
    return;
  }

  addParagraph(line.trim());
});
}

fetch(markdownPath)
  .then(response => {
    if (!response.ok) throw new Error(`failed to load ${markdownPath}`);
    return response.text();
  })
  .then(source => render(source.trim()))
  .catch(error => {
    doc.innerHTML = `<p>${escapeHtml(error.message)}</p>`;
  });

document.getElementById('expand-all').addEventListener('click', () => {
  track('date_control_click', { control_name: 'expand_all' });
  document.querySelectorAll('details').forEach(detail => detail.open = true);
});

document.getElementById('fold-all').addEventListener('click', () => {
  track('date_control_click', { control_name: 'fold_all' });
  document.querySelectorAll('details').forEach(detail => detail.open = false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('to-top').addEventListener('click', () => {
  track('date_control_click', { control_name: 'to_top' });
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

doc.addEventListener('click', event => {
  const summary = event.target.closest('summary');
  if (summary && doc.contains(summary)) {
    const detail = summary.parentElement;
    track('date_section_toggle', {
      section_title: detail.dataset.title || summary.textContent.trim(),
      section_kind: detail.dataset.kind || 'details',
      toggle_state: detail.open ? 'close' : 'open'
    });
    return;
  }

  const link = event.target.closest('a[href]');
  if (link && doc.contains(link)) {
    track('date_link_click', {
      link_text: link.textContent.trim().slice(0, 100),
      link_url: link.href
    });
  }
});
</script>
</body>
</html>
