<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ted nguyen work doc">
<title>ted nguyen</title>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H0QLVMEDVT"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-H0QLVMEDVT', {
    page_title: 'ted nguyen',
    page_path: '/work/'
  });
</script>
<link rel="icon" type="image/png" href="../ted.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f1;
    --panel: #ffffff;
    --panel-2: #f7f7f4;
    --border: #8b8f87;
    --text: #111513;
    --muted: #4d554f;
    --dim: #6b736d;
    --accent: #005f46;
    --gold: #6f4d00;
    --shadow: rgba(0, 0, 0, 0.18);
    --font: Arial, Helvetica, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.65;
  }

  ::-webkit-scrollbar { width: 12px; background: #eef1ed; border-left: 1px solid var(--border); }
  ::-webkit-scrollbar-thumb { background: #b9beb6; border: 1px solid var(--dim); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); border-color: var(--text); }

  .page {
    width: min(760px, calc(100% - 32px));
    margin: 24px auto 48px;
    background: var(--bg);
  }

  #doc {
    min-width: 0;
    padding: 8px 0 28px;
  }

  .section {
    background: transparent;
    border: 0;
    border-bottom: 1px solid #ccc;
    margin: 0;
    padding: 16px 0;
  }

  .section > h2 {
    margin: 0 0 8px;
    color: var(--text);
    font-size: 22px;
    font-weight: 700;
    padding: 0;
    background: transparent;
    border: 0;
  }

  .content {
    padding: 0;
  }

  .subsection {
    background: transparent;
    border: 0;
    margin-top: 16px;
  }

  .subsection > h3 {
    margin: 0 0 6px;
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    padding: 0;
    background: transparent;
    border: 0;
  }

  p { margin: 12px 0; color: var(--text); }
  ul { margin: 10px 0 14px; padding-left: 22px; }
  li { margin: 7px 0; }

  a {
    color: #004f9f;
    text-decoration: underline;
  }

  img {
    display: block;
    max-width: min(100%, 720px);
    height: auto;
    margin: 14px 0;
  }

  blockquote {
    margin: 12px 0;
    padding: 2px 0 2px 16px;
    border-left: 3px solid var(--accent);
    color: var(--muted);
  }

  hr {
    border: 0;
    border-top: 2px dashed var(--border);
    margin: 18px 0;
  }


</style>
</head>
<body>
<main class="page">
  <article id="doc"></article>
</main>

<script>
const markdownPath = `/work.md?v=${Date.now()}`;
const doc = document.getElementById('doc');
let currentSection = null;
let currentSectionContainer = null;
let currentContainer = null;
let pendingList = null;
let pendingQuote = null;

function track(eventName, params = {}) {
  if (typeof gtag !== 'function') return;
  gtag('event', eventName, {
    page_name: 'work',
    ...params
  });
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[char]));
}

function inlineMarkup(value) {
  return escapeHtml(value)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}

function flushBlocks() {
  pendingList = null;
  pendingQuote = null;
}

function activeContainer() {
  if (!currentContainer) {
    currentSection = makeSection('notes', 'section');
    doc.appendChild(currentSection);
    currentSectionContainer = currentSection.querySelector('.content');
    currentContainer = currentSectionContainer;
  }
  return currentContainer;
}

function slug(title) {
  return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function headingLabel(title) {
  const match = title.match(/^\[([^\]]+)\]\(([^)\s]+)\)$/);
  return match ? match[1] : title;
}

function makeSection(title, className) {
  const section = document.createElement('section');
  section.className = className;
  section.id = slug(headingLabel(title));
  const heading = document.createElement(className === 'subsection' ? 'h3' : 'h2');
  heading.innerHTML = inlineMarkup(title);
  heading.id = slug(headingLabel(title));
  const content = document.createElement('div');
  content.className = 'content';
  section.append(heading, content);
  return section;
}

function addParagraph(line) {
  flushBlocks();
  const image = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
  if (image) {
    const [, alt, src] = image;
    if (/\.(png|jpe?g|gif|webp|avif|svg)(\?.*)?$/i.test(src)) {
      const img = document.createElement('img');
      img.src = src;
      img.alt = alt || '';
      activeContainer().appendChild(img);
    } else {
      const p = document.createElement('p');
      p.innerHTML = `<a href="${escapeHtml(src)}" target="_blank" rel="noopener">${escapeHtml(alt || src)}</a>`;
      activeContainer().appendChild(p);
    }
    return;
  }

  const p = document.createElement('p');
  p.innerHTML = inlineMarkup(line);
  activeContainer().appendChild(p);
}

function render(source) {
doc.innerHTML = '';
currentSection = null;
currentSectionContainer = null;
currentContainer = null;
pendingList = null;
pendingQuote = null;

source.split('\n').forEach(rawLine => {
  const line = rawLine.trimEnd();

  if (!line.trim()) {
    flushBlocks();
    return;
  }

  if (line.startsWith('## ')) {
    flushBlocks();
    currentSection = makeSection(line.slice(3).trim(), 'section');
    doc.appendChild(currentSection);
    currentSectionContainer = currentSection.querySelector('.content');
    currentContainer = currentSectionContainer;
    return;
  }

  if (line.startsWith('### ') || line.startsWith('= ')) {
    flushBlocks();
    const subsection = makeSection(line.replace(/^(###|=)\s+/, '').trim(), 'subsection');
    activeContainer();
    currentSectionContainer.appendChild(subsection);
    currentContainer = subsection.querySelector('.content');
    return;
  }

  if (line === '[[section-note]]' || line === '<!-- section-note -->') {
    flushBlocks();
    currentContainer = currentSectionContainer;
    return;
  }

  if (line === '---') {
    flushBlocks();
    activeContainer().appendChild(document.createElement('hr'));
    return;
  }

  if (line.startsWith('- ')) {
    pendingQuote = null;
    if (!pendingList) {
      pendingList = document.createElement('ul');
      activeContainer().appendChild(pendingList);
    }
    const li = document.createElement('li');
    li.innerHTML = inlineMarkup(line.slice(2).trim());
    pendingList.appendChild(li);
    return;
  }

  if (line.startsWith('> ')) {
    pendingList = null;
    if (!pendingQuote) {
      pendingQuote = document.createElement('blockquote');
      activeContainer().appendChild(pendingQuote);
    }
    const p = document.createElement('p');
    p.innerHTML = inlineMarkup(line.slice(2).trim());
    pendingQuote.appendChild(p);
    return;
  }

  addParagraph(line.trim());
});
}

fetch(markdownPath)
  .then(response => {
    if (!response.ok) throw new Error(`failed to load ${markdownPath}`);
    return response.text();
  })
  .then(source => render(source.trim()))
  .catch(error => {
    doc.innerHTML = `<p>${escapeHtml(error.message)}</p>`;
  });

doc.addEventListener('click', event => {
  const link = event.target.closest('a[href]');
  if (link && doc.contains(link)) {
    track('work_link_click', {
      link_text: link.textContent.trim().slice(0, 100),
      link_url: link.href
    });
  }
});
</script>
</body>
</html>
